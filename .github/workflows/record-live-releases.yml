name: Record live site releases

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-live-site-releases
  cancel-in-progress: false

jobs:
  record-releases:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Commit each newly published design version
        run: node scripts/sync-releases.mjs
