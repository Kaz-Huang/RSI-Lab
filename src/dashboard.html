<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RSI LAB 自进化实验室：自动观察、自动验证、自动发布与自动止损。"><meta name="theme-color" content="#f6f7f2"><title>RSI LAB · 自进化实验室</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23203b2b'/%3E%3Ctext x='8' y='29' fill='%23d8ebaf' font-size='30'%3E↻%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/dashboard.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="/"><span class="mark" aria-hidden="true">↻</span><div><strong>RSI LAB</strong><small>EVOLUTION BY DESIGN</small></div></a><div class="project"><div class="eyebrow">RESEARCH PROJECT / 001</div><strong>网站自进化实验</strong><p>让每一次迭代，都有据可循。</p></div><div class="nav-label">WORKSPACE</div><nav aria-label="实验室导航"><button class="active" data-view="overview"><i aria-hidden="true">◫</i>实验概览<span>01</span></button><button data-view="runs"><i aria-hidden="true">↻</i>进化记录<span>02</span></button><button data-view="versions"><i aria-hidden="true">▱</i>版本与预览<span>03</span></button><button data-view="memory"><i aria-hidden="true">✧</i>经验记忆<span>04</span></button><button data-view="settings"><i aria-hidden="true">⚙</i>运行与边界<span>05</span></button></nav><div class="side-bottom"><div class="side-note"><strong><span class="dot"></span> 自动驾驶已开启</strong>每天自动观察、验证和发布一项白名单改动；异常时保留原版本并暂停。</div><div class="side-footer"><span>ON CLOUDFLARE</span><span class="cloud">☁</span></div></div></aside>
<div class="shell"><header class="topbar"><div class="crumb">实验室<b>/</b><strong id="breadcrumb">实验概览</strong></div><div class="top-actions"><a class="btn" href="/site" target="_blank" rel="noopener">查看线上网站 ↗</a><button class="btn ghost hidden" id="logout">退出</button></div></header><main class="content"><div id="error-banner" role="alert" hidden></div><div id="app"><div class="loading">正在连接实验室…</div></div><footer class="footer"><span>RSI LAB / EVOLVE WITH EVIDENCE.</span><span>MVP 0.1 · CONTROLLED EVOLUTION</span></footer></main></div>
<dialog id="confirm-dialog"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><label class="field-label hidden" id="note-label" for="decision-note">拒绝原因</label><textarea id="decision-note" class="hidden" maxlength="500" placeholder="例如：当前字号需要保持紧凑，不适合这一调整。"></textarea><div id="dialog-error" class="error-text" role="alert"></div><div class="actions"><button class="btn" id="dialog-cancel">取消</button><button class="btn primary" id="dialog-confirm">确认</button></div></dialog><div id="toast" role="status" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={pending:'自动处理中',released:'已自动发布',rejected:'已拒绝',no_change:'保持不变',rolled_back:'已回滚',stale:'基线失效'};
const names={overview:'实验概览',runs:'进化记录',versions:'版本与预览',memory:'经验记忆',settings:'运行与边界'};
let state=null, view='overview', selected=null, busy=false, timer, confirmAction;
const date = v => new Date(v).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const badge = status => `<span class="pill ${status==='pending'?'amber':status==='rejected'||status==='rolled_back'?'red':status==='no_change'?'gray':''}"><span class="dot"></span>${labels[status]||esc(status)}</span>`;
const current = () => state.versions.find(v=>v.id===state.currentVersion);
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,4500)}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw new Error(value.error||'请求失败，请重试。');return value}
async function refresh(){try{state=await api('/api/state');$('#error-banner').hidden=true;render()}catch(e){$('#error-banner').textContent=e.message;$('#error-banner').hidden=false;if(!state)$('#app').innerHTML='<div class="empty"><strong>暂时无法连接实验室</strong><p>请稍后重试，已保存的数据不会丢失。</p><button class="btn" data-action="refresh">重新连接</button></div>'}}
function login(){return `<div class="login-wrap"><section class="login-art"><div class="eyebrow">RECURSIVE SELF-IMPROVEMENT</div><h1>每次进化，<br>都有迹可循。</h1><p>从观察一个真实问题开始。提出改动，验证效果，只把有证据的改进留给下一版。</p><div class="orbit" aria-hidden="true"><i></i></div></section><form class="login-form" id="login-form"><div class="eyebrow" style="margin-bottom:17px">WELCOME TO THE LAB</div><h2>进入你的实验室</h2><p>网站已经开启自动驾驶。管理密钥只用于查看记录、暂停进化、导出证据或手动回滚。</p><label class="field-label" for="admin-key">管理密钥</label><input id="admin-key" name="key" type="password" autocomplete="current-password" required placeholder="输入本地交付文件中的管理密钥"><button class="btn primary" type="submit">进入实验室 →</button><div id="login-error" class="error-text" role="alert"></div><a class="btn ghost" href="/site">先看看正在进化的网站 ↗</a></form></div><div class="login-info"><article><h3>01 / 自动观察</h3><p>每天固定时间检查真实页面样式，选择一个可逆的小改动。</p></article><article><h3>02 / 自动发布</h3><p>固定门禁通过后，系统自动切换线上版本，不等待人工审批。</p></article><article><h3>03 / 自动止损</h3><p>异常、失败或达到上限时保留原版本并暂停，历史证据不会丢失。</p></article></div>`}
function pageHead(eyebrow,title,description,side=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="lead">${description}</p></div>${side}</div>`}
function steps(run){const words=['观察','假设','改动','验证','发布','记忆'];const english=['OBSERVE','HYPOTHESIZE','CHANGE','VERIFY','RELEASE','LEARN'];return `<div class="steps">${words.map((x,i)=>{let cls='',label=x;if(run){if(run.status==='pending'){cls=i<4?'done':i===4?'active':'';label=i<4?'✓ '+x:i===4?'发布 · 自动处理中':x}else if(run.status==='no_change'){cls=i===0||i===5?'done':'';label=i===0||i===5?'✓ '+x:i===4?'未发布':x+' · 跳过'}else{cls=i<4||i===5?'done':'';label=i<4||i===5?'✓ '+x:run.status==='released'?'✓ 已自动发布':run.status==='rolled_back'?'已回滚':'未发布'}}return `<div class="step ${cls}"><span>0${i+1} / ${english[i]}</span>${label}</div>`}).join('')}</div>`}
function experiment(run,full=false){if(!run)return `<div class="panel empty"><strong>第一轮进化，从现在开始。</strong><p>运行一次检查，系统会自动验证并发布一套完整的视觉方向。</p><button class="btn primary" style="margin-top:16px" data-action="run" ${state.paused?'disabled':''}>↻ 运行一轮</button></div>`;return `<div class="panel"><div class="panel-head"><h3><span class="tabular-id">RUN ${String(run.number).padStart(3,'0')}</span> · ${esc(run.baseVersion)} → ${run.releasedVersion||'候选'}</h3>${badge(run.status)}</div><div class="experiment"><div class="experiment-copy"><div class="eyebrow">${run.change?.key==='design'?'ONE DIRECTION. ONE HYPOTHESIS.':run.change?'ONE CHANGE. ONE HYPOTHESIS.':'OBSERVATION COMPLETE'}</div><h3>${esc(run.title)}</h3><p>${esc(run.change?.hypothesis||run.reason)}</p>${run.change?`<div class="change-code">${esc(run.change.key)}<br><del>− ${esc(run.baseline[run.change.key] || run.baseline.design)}</del><br><ins>+ ${esc(run.candidate[run.change.key] || run.candidate.design)}</ins></div>`:''}<div class="actions">${run.status==='pending'&&state.autonomy?.enabled===false?`<button class="btn primary" data-action="approve" data-id="${run.id}" ${state.paused?'disabled':''}>✓ 发布</button><button class="btn" data-action="reject" data-id="${run.id}">拒绝候选</button>`:''}${run.status==='pending'&&state.autonomy?.enabled!==false?'<span class="pill amber">自动门禁处理中，系统将自行决定</span>':''}<button class="btn ${full?'ghost':''}" data-action="detail" data-id="${run.id}">${full?'刷新详情':'查看证据与预览 →'}</button></div><div class="footnote">${date(run.createdAt)} · ${run.source==='cron'?'每日自动调度':'手动触发'} · ${run.releaseMode==='autonomous'?'自动发布':'自动门禁'} · 使用 ${run.memoryUsed} 条避重记忆</div></div><div class="evidence"><h3 style="margin-bottom:10px">固定设计门禁</h3>${run.evidence?run.evidence.gates.map(g=>`<div class="gate"><span>${esc(g.label)}</span><b>${g.pass?'✓ 通过':'× 未通过'}</b></div>`).join(''):`<p class="muted" style="font-size:12px">${esc(run.reason)}</p>`}<p class="footnote">评测版本：${esc(run.policy)}<br>这是对设计配置的确定性检查，不代表用户转化率或性能已经提升。</p></div></div></div>`}
function memories(items){return items.length?items.map(m=>`<article class="memory-row"><div class="memory-top">${badge(m.outcome)}<small>${date(m.at)}</small></div><p>${esc(m.note)}</p><small>${esc(m.key||'observation')} / ${esc(m.policy)}</small></article>`).join(''):'<div class="empty"><strong>经验，从真实结果中生长。</strong>处理第一轮候选后，记忆会出现在这里。</div>'}
function overview(){const pending=state.runs.find(r=>r.status==='pending'),latest=pending||state.runs[0];const passed=state.metrics.filter(m=>m.pass).length;return pageHead('EXPERIMENT / 001','每一天，向前一小步。','观察真实问题，验证每个改动，让经验进入下一轮。',`<span class="pill ${state.paused?'amber':''}"><span class="dot"></span>${state.paused?'自动驾驶已暂停':'自动驾驶运行中'}</span>`)+`<div class="overview-grid"><section class="mission"><div class="eyebrow">THE NEXT SMALL STEP</div><h2>${pending?'一套新视觉，<br>自动门禁处理中。':'下一次进化，<br>从真实观察开始。'}</h2><p>${pending?esc(pending.change?.hypothesis||'系统正在完成发布前的最后检查。'):'检查线上页面，自动发布一套有明显差异的视觉方向。没有新方向时，安心保持不变。'}</p><button class="btn" data-action="${pending?'detail':'run'}" ${pending?`data-id="${pending.id}"`:''} ${!pending&&state.paused?'disabled':''}>${pending?'查看自动门禁 ↗':'↻  运行一轮进化'}</button><div class="orbit" aria-hidden="true"><i></i></div></section><section class="schedule"><div class="schedule-title"><span>下一次自动观察</span><span>◷</span></div><div class="time">03:00 <span>每天</span></div><p>北京时间 · UTC+8</p><div class="schedule-bottom"><span>${state.paused?'已暂停，等待恢复':pending?'自动处理后继续观察':'一次唤醒，一套视觉方向'}</span><button class="btn ghost small" data-action="pause">${state.paused?'恢复 ↗':'暂停'}</button></div></section></div><div class="stats"><div class="stat"><div class="stat-label">可追溯运行</div><div class="stat-value">${String(state.runs.length).padStart(2,'0')}<small>轮</small></div><div class="stat-foot">每轮都留下证据</div></div><div class="stat"><div class="stat-label">当前线上版本</div><div class="stat-value">${state.currentVersion}</div><div class="stat-foot">${state.versions.length} 个版本可查</div></div><div class="stat"><div class="stat-label">阅读规则达标</div><div class="stat-value">${passed}<small>/ 3</small></div><div class="stat-foot">固定底线 · 非质量总分</div></div><div class="stat"><div class="stat-label">累计经验记忆</div><div class="stat-value">${String(state.memory.length).padStart(2,'0')}<small>条</small></div><div class="stat-foot">保留负向与不确定结果</div></div></div><div class="section-head"><h2>这一轮，如何进化？</h2><button class="btn ghost small" data-view="runs">全部运行记录 ↗</button></div>${steps(latest)}${experiment(latest)}<div class="lower-grid"><section><div class="section-head"><h2>当前网站 · 阅读基线</h2><span class="eyebrow">LIVE CONFIG</span></div><div class="panel">${state.metrics.map(m=>`<div class="metric-row"><span>${esc(m.label)}</span><strong>${m.value}${m.unit} ${m.pass?'✓':''}</strong><small>目标 ≥ ${m.target}${m.unit} · ${esc(m.source)}</small><div class="bar"><i style="width:${Math.min(100,m.value/m.target*100)}%"></i></div></div>`).join('')}</div></section><section><div class="section-head"><h2>留给下一轮的经验</h2><button class="btn ghost small" data-view="memory">查看全部 ↗</button></div><div class="panel">${memories(state.memory.slice(0,2))}</div></section></div><div class="notice">自主模式范围：规则驱动的视觉设计进化。系统每天自动发布白名单内的一套完整方向；异常、失败或达到上限时保留原版本并暂停。对比度按实际页面背景计算，设计词汇包含布局、色彩、字体和留白。系统不会修改 Worker 权限、外部站点或数据库结构。</div>`}
function runList(){return pageHead('EVOLUTION LOG','每一次尝试，都有记录。','自动发布、自动拒绝、保持不变，都会进入同一条证据链。',`<button class="btn primary" data-action="run" ${state.paused?'disabled':''}>↻ 立即运行一轮</button>`)+`<div class="panel table-scroll"><table><thead><tr><th>运行</th><th>改进假设</th><th>基线</th><th>结果</th><th>发起时间</th><th></th></tr></thead><tbody>${state.runs.map(r=>`<tr><td class="mono">#${String(r.number).padStart(3,'0')}</td><td class="table-title"><strong>${esc(r.title)}</strong></td><td class="mono">${r.baseVersion}</td><td>${badge(r.status)}</td><td>${date(r.createdAt)}</td><td><button class="btn small" data-action="detail" data-id="${r.id}">查看 →</button></td></tr>`).join('')}</tbody></table>${state.runs.length?'':'<div class="empty">还没有运行记录。点击「立即运行一轮」，系统会自动完成门禁和发布。</div>'}</div>`}
function detail(){const r=state.runs.find(x=>x.id===selected);if(!r)return runList();return pageHead(`RUN / ${String(r.number).padStart(3,'0')}`,r.status==='released'?'系统已验证并完成发布。':'自动门禁记录。',`基线 ${r.baseVersion} · 固定评测 ${r.policy}`,`<button class="btn" data-view="runs">← 返回记录</button>`)+steps(r)+experiment(r,true)+(r.candidate?`<div class="section-head"><h2>改动前后 · 真实页面预览</h2><span class="eyebrow">SAME CONTENT / ONE CHANGE</span></div><div class="compare"><div class="frame"><header><span>BEFORE · ${r.baseVersion}</span><a href="/site?version=${r.baseVersion}" target="_blank" rel="noopener">打开 ↗</a></header><iframe title="改动前的页面" src="/site?version=${r.baseVersion}#reading"></iframe></div><div class="frame"><header><span>AFTER · 候选样式</span><a href="/site?run=${r.id}" target="_blank" rel="noopener">打开 ↗</a></header><iframe title="候选页面预览" src="/site?run=${r.id}#reading"></iframe></div></div><div class="panel table-scroll"><table><thead><tr><th>评测项</th><th>基线</th><th>候选</th><th>目标</th><th>结论</th></tr></thead><tbody>${r.evidence.metrics.map(m=>`<tr><td>${esc(m.label)}</td><td class="mono">${m.before}${m.unit}</td><td class="mono">${m.value}${m.unit}</td><td>≥ ${m.target}${m.unit}</td><td>${m.pass?'✓ 达标':'后续改进'}</td></tr>`).join('')}</tbody></table></div>`:'')+`<div class="notice">自动门禁会在每轮发布前重新检查基线版本、暂停状态和固定门槛。异常时保持原版本并记录原因；管理员仍可从“运行与边界”手动暂停或回滚。</div>`}
function versions(){const v=current();return pageHead('VERSION HISTORY','每一步前进，都能回看。','线上页面只读取自动门禁通过的配置版本。',`<button class="btn danger" data-action="rollback" ${v.previousVersion&&v.runId?'':'disabled'}>↶ 回滚并暂停</button>`)+`<div class="panel table-scroll"><table><thead><tr><th>版本</th><th>变更说明</th><th>发布时间</th><th>状态</th><th>预览</th></tr></thead><tbody>${[...state.versions].reverse().map(x=>`<tr><td class="mono">${x.id}</td><td class="table-title"><strong>${esc(x.reason)}</strong></td><td>${date(x.createdAt)}</td><td>${x.id===state.currentVersion?'<span class="pill"><span class="dot"></span>线上版本</span>':'<span class="muted">历史记录</span>'}</td><td><a class="btn small" target="_blank" rel="noopener" href="/site?version=${x.id}">查看 ↗</a></td></tr>`).join('')}</tbody></table></div><div class="section-head"><h2>当前线上网站</h2><a href="/site" target="_blank" rel="noopener">在新窗口打开 ↗</a></div><div class="frame"><iframe style="height:600px" title="当前线上网站" src="/site?version=${state.currentVersion}"></iframe></div><p class="footnote">回滚会创建新的恢复版本并暂停自动驾驶，历史证据仍保留。管理员恢复前，系统不会继续自动发布。</p>`}
function memory(){return pageHead('LEARNING MEMORY','下一轮，从这次经验开始。','被拒绝或回滚的方向会进入记忆；这会影响下一次生成，但不会改写评测器或 Worker 代码。',`<a class="btn" href="/api/export">↓ 导出证据</a>`)+`<div class="panel">${memories(state.memory)}</div><div class="notice">策略版本：${esc(state.autonomy?.policy||'autonomous-design-v3')}。当前策略不会自主更改评测、提示词或自身代码；验证“有记忆优于无记忆”需要后续固定预算的对照实验。</div>`}
function settings(){return pageHead('OPERATION & GUARDRAILS','把边界，放在进化之前。','自动驾驶负责日常视觉进化；权限只保留给暂停、回滚和证据查看。')+`<div class="settings-grid"><div class="panel"><div class="panel-head"><h3>运行状态</h3><span class="pill ${state.paused?'amber':''}">${state.paused?'自动驾驶已暂停':state.autonomy?.enabled?'自动驾驶开启':'已启用'}</span></div><div class="panel-body"><div class="setting-row"><span>每日观察</span><span>北京时间 03:00</span></div><div class="setting-row"><span>UTC 调度</span><span class="mono">0 19 * * *</span></div><div class="setting-row"><span>自动发布</span><span>固定设计门禁通过后立即发布</span></div><div class="setting-row"><span>累计页面请求</span><span>${state.views} 次 · 含重复与机器人请求</span></div><div class="setting-row"><span>模型调用</span><span>Workers AI · 不合规时程序生成回退</span></div><button style="margin-top:20px" class="btn primary" data-action="pause">${state.paused?'恢复自动驾驶':'暂停自动驾驶'}</button></div></div><div class="panel"><div class="panel-head"><h3>不可自主修改的边界</h3><span class="pill gray">FROZEN</span></div><div class="panel-body"><div class="setting-row"><span>评测版本</span><span>${state.policy}</span></div><div class="setting-row"><span>自动驾驶策略</span><span>${state.autonomy?.policy||'autonomous-design-v3'}</span></div><div class="setting-row"><span>可修改范围</span><span>布局 / 颜色 / 字体 / 间距 / 装饰</span></div><div class="setting-row"><span>单轮改动</span><span>一套完整视觉方向</span></div><div class="setting-row"><span>发布权限</span><span>自动门禁</span></div><div class="setting-row"><span>数据保留上限</span><span>200 轮 · 达上限自动暂停</span></div><div class="setting-row"><span>禁止改动</span><span>Worker 权限、外部站点、数据库结构</span></div></div></div></div><div class="section-head"><h2>操作审计</h2><a href="/api/export">导出全部证据 ↓</a></div><div class="panel table-scroll"><table><thead><tr><th>操作</th><th>详情</th><th>时间</th></tr></thead><tbody>${state.audit.slice(0,30).map(a=>`<tr><td class="mono">${esc(a.action)}</td><td class="table-title">${esc(a.detail)}</td><td>${date(a.at)}</td></tr>`).join('')}</tbody></table>${state.audit.length?'':'<div class="empty">还没有操作记录。</div>'}</div>`}
function render(){const admin=state?.admin;$('#logout').classList.toggle('hidden',!admin);$('#breadcrumb').textContent=admin?(names[view]||'候选详情'):'进入实验室';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#app').innerHTML=!admin?login():view==='overview'?overview():view==='runs'?runList():view==='detail'?detail():view==='versions'?versions():view==='memory'?memory():settings();if(busy)document.querySelectorAll('button[data-action]').forEach(b=>b.disabled=true)}
async function act(path,data,message){if(busy)return;busy=true;render();try{await api(path,data);await refresh();toast(message)}catch(e){toast(e.message);await refresh()}finally{busy=false;render()}}
function dialog(title,copy,label,callback,note=false){$('#dialog-title').textContent=title;$('#dialog-copy').textContent=copy;$('#dialog-confirm').textContent=label;$('#decision-note').value='';$('#decision-note').classList.toggle('hidden',!note);$('#note-label').classList.toggle('hidden',!note);$('#dialog-error').textContent='';confirmAction=callback;$('#confirm-dialog').showModal();if(note)$('#decision-note').focus()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();window.scrollTo({top:0,behavior:'instant'});return}const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action,id=b.dataset.id;if(a==='refresh')refresh();if(a==='detail'){selected=id;view='detail';render();window.scrollTo({top:0,behavior:'instant'})}if(a==='run')act('/api/runs',{requestId:crypto.randomUUID()},'本轮观察与评测已完成。');if(a==='pause')act('/api/pause',{paused:!state.paused},state.paused?'进化已恢复。':'进化与发布已暂停。');if(a==='approve')dialog('批准这个小改动？','候选将替换线上阅读样式。固定检查通过仅说明规则达标，尚未验证真实用户收益。','批准并发布',()=>act('/api/decision',{id,action:'approve'},'新版本已发布，经验已保存。'));if(a==='reject')dialog('拒绝候选，留下原因。','拒绝后，这个参数会进入避重记忆，后续运行不会反复提出同一调整。','拒绝并记录',()=>{const note=$('#decision-note').value.trim();if(note.length<2){$('#dialog-error').textContent='请至少填写两个字符。';return false}return act('/api/decision',{id,action:'reject',note},'候选已拒绝，原因已记入经验。')},true);if(a==='rollback')dialog('恢复上一版，并暂停进化？','将恢复最近一次发布前的阅读样式，保留全部历史，并停止后续自动改动。','确认回滚',()=>act('/api/rollback',{},'已恢复上一版样式，进化已暂停。'))});
$('#dialog-cancel').onclick=()=>$('#confirm-dialog').close();$('#dialog-confirm').onclick=()=>{const result=confirmAction?.();if(result!==false)$('#confirm-dialog').close()};
document.addEventListener('submit',async e=>{if(e.target.id!=='login-form')return;e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='正在连接…';try{await api('/api/login',{key:$('#admin-key').value});await refresh()}catch(err){$('#login-error').textContent=err.message;btn.disabled=false;btn.textContent='进入实验室 →'}});
$('#logout').onclick=async()=>{try{await api('/api/logout',{});view='overview';await refresh()}catch(e){toast(e.message)}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy&&!$('#confirm-dialog').open)refresh()});
refresh();
</script><noscript><p>请启用 JavaScript 使用实验控制台。线上阅读页不依赖 JavaScript。</p></noscript></body></html>
